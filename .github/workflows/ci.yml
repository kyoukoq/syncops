name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m pip check
      - name: Audit backend runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit -r requirements.txt --progress-spinner off

  frontend:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --audit-level high

  compose-smoke:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Generate isolated CI credentials
        shell: pwsh
        run: ./scripts/Initialize-Compose.ps1
      - name: Build and start the core stack
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
      - name: Verify PostgreSQL-backed delivery through the frontend proxy
        run: python3 scripts/smoke.py --credentials .env
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm exec -- playwright install --with-deps --only-shell chromium
      - name: Exercise the isolated Compose UI in Chromium
        run: |
          source .env
          SYNCOPS_E2E_URL=http://127.0.0.1:8080/ \
            SYNCOPS_E2E_ADMIN_PASSWORD="$SYNCOPS_ADMIN_PASSWORD" npm --prefix frontend run test:e2e
      - name: Show container state
        if: failure()
        run: docker compose ps -a
      - name: Stop the isolated CI stack
        if: always()
        run: docker compose down --volumes
