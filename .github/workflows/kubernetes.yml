name: Kubernetes lab

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'charts/**'
      - 'deploy/**'
      - 'compose.yaml'
      - 'scripts/smoke.py'
      - '.github/workflows/kubernetes.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'charts/**'
      - 'deploy/**'
      - 'compose.yaml'
      - 'scripts/smoke.py'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      KIND_VERSION: v0.31.0
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KUBECTL_VERSION: v1.35.0
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install versioned, checksum-verified tools
        run: |
          cd "$RUNNER_TEMP"
          kind_url="https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION"
          kubectl_url="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64"
          helm_archive="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl --proto '=https' -fsSLO --retry 3 "$kind_url/kind-linux-amd64"
          printf '%s  %s\n' "$KIND_SHA256" kind-linux-amd64 | sha256sum -c -
          curl --proto '=https' -fsSLO --retry 3 "$kubectl_url/kubectl"
          curl --proto '=https' -fsSLO --retry 3 "$kubectl_url/kubectl.sha256"
          printf '%s  %s\n' "$(cat kubectl.sha256)" kubectl | sha256sum -c -
          curl --proto '=https' -fsSLO --retry 3 "https://get.helm.sh/$helm_archive"
          printf '%s  %s\n' "$HELM_SHA256" "$helm_archive" | sha256sum -c -
          tar -xzf "$helm_archive" linux-amd64/helm
          install -D -m 0755 kind-linux-amd64 "$RUNNER_TEMP/syncops-bin/kind"
          install -m 0755 kubectl linux-amd64/helm "$RUNNER_TEMP/syncops-bin"
          echo "$RUNNER_TEMP/syncops-bin" >> "$GITHUB_PATH"
      - name: Lint the chart and render the TLS ingress option
        run: |
          helm lint charts/syncops --strict --kube-version "$KUBECTL_VERSION"
          helm template syncops charts/syncops -n syncops-staging --kube-version "$KUBECTL_VERSION" --set ingress.enabled=true \
            --set ingress.host=syncops.test,ingress.className=nginx,ingress.tlsSecretName=syncops-tls \
            > "$RUNNER_TEMP/syncops-ingress.yaml"
      - name: Create a disposable kind cluster and load local images
        run: |
          kind create cluster --name syncops-ci --image "$KIND_NODE_IMAGE" --wait 180s
          docker build -t syncops/backend:local -f deploy/backend.Dockerfile backend
          docker build --build-context config=deploy -t syncops/frontend:local -f deploy/frontend.Dockerfile frontend
          docker pull postgres:17-bookworm
          kind load docker-image --name syncops-ci syncops/backend:local syncops/frontend:local postgres:17-bookworm
      - name: Create isolated environments and validate admission
        run: |
          for namespace in syncops-staging syncops-production-lab; do
            kubectl create namespace "$namespace"
            kubectl label namespace "$namespace" pod-security.kubernetes.io/enforce=restricted
            pwsh -NoProfile -File deploy/kubernetes/Initialize-Secrets.ps1 \
              -Context kind-syncops-ci -Namespace "$namespace"
          done
          kubectl -n syncops-staging apply --dry-run=server --validate=strict \
            -f "$RUNNER_TEMP/syncops-ingress.yaml"
      - name: Install and verify scaling, persistence, isolation and rollback
        run: bash deploy/kubernetes/verify-kind.sh
      - name: Show workload state on failure
        if: failure()
        run: |
          for namespace in syncops-staging syncops-production-lab; do
            kubectl -n "$namespace" get pods,job,pvc,deploy,sts,svc -o wide || true
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -35 || true
          done
      - name: Stop the disposable cluster
        if: always()
        run: kind delete cluster --name syncops-ci
