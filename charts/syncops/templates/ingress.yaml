{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when enabling ingress" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "syncops.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ required "ingress.className is required when enabling ingress" .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ required "ingress.tlsSecretName is required when enabling ingress" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
{{- end }}
