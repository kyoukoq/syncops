{{- if .Values.networkPolicy.enabled }}
{{- $rules := dict "api" (dict "port" 8000 "clients" (list "web"))
    "mock" (dict "port" 8001 "clients" (list "worker"))
    "db" (dict "port" 5432 "clients" (list "api" "mock" "worker" "migrate")) }}
{{- range $component, $rule := $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "syncops.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syncops.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "syncops.labels" $ | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{ $rule.clients | toJson }}
      ports:
        - {port: {{ $rule.port }}, protocol: TCP}
{{- end }}
{{- end }}
