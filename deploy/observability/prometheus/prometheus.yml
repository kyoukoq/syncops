global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/syncops-alerts.yml

scrape_configs:
  - job_name: syncops-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    sample_limit: 100
    body_size_limit: 64KB
    follow_redirects: false

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

storage:
  tsdb:
    retention:
      time: 7d
      size: 256MB
